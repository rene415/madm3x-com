version: '3.8'

services:
  web:
    build: .
    container_name: madm3x-web
    ports:
      - "32780:4321"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - madm3x_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  madm3x_data:
